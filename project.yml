# XcodeGen spec — the SOURCE OF TRUTH for the Xcode project.
# Never hand-edit Doigt.xcodeproj. Edit THIS file, then run ./build.sh
# (which runs `xcodegen generate` before every build).
name: Doigt

options:
  bundleIdPrefix: run.nuri
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # The compiler emits one .stringsdata per source file listing every localization
    # key it saw — that is the ONLY authoritative inventory of what the app actually
    # asks to translate, and it is what the .xcstrings catalogs are authored against.
    SWIFT_EMIT_LOC_STRINGS: YES
    # Xcode auto-creates the App ID + provisioning for run.nuri.doigt, including
    # the App Group and iCloud container, on the first team-signed build.
    DEVELOPMENT_TEAM: ""
    GETAGRIP_APP_GROUP: group.run.nuri.doigt
    GETAGRIP_CLOUD_CONTAINER: iCloud.run.nuri.doigt
    # The iOS app's bundle id, as the watch app needs it twice: as its companion and as
    # the prefix of its own `<companion>.watchkitapp`. Forks set it beside their
    # PRODUCT_BUNDLE_IDENTIFIER in project.local.yml.
    GETAGRIP_COMPANION_BUNDLE_ID: run.nuri.doigt
    # Frez Dyno calibration lookups need a Frez Developer Program access key. It is
    # PRIVATE and never committed: the official build supplies it from the ignored
    # project.local.yml (see BUILDING.md). Empty here, so source, CI and forks build a
    # Dyno that connects and says it cannot fetch its calibration.
    FREZ_ACCESS_KEY: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Doigt:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Legal/current
      # Compiled into the app today; kept as its own root so a widget target can
      # include it verbatim later without moving a single file.
      - path: Shared
    info:
      path: Sources/Info.plist
      properties:
        # The public name. "Doigt" survives only as the internal codename: bundle ids,
        # container, App Group, store name, target names — none of which a user sees.
        GetAGripAppGroup: "$(GETAGRIP_APP_GROUP)"
        GetAGripCloudContainer: "$(GETAGRIP_CLOUD_CONTAINER)"
        # Read by FrezCoefficientResolver; "" means "this build has no key".
        FrezAccessKey: "$(FREZ_ACCESS_KEY)"
        CFBundleDisplayName: "Get a Grip"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Fully offline (CloudKit is Apple infrastructure) → exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Shown when the FIRST connect tap creates the CBCentralManager — never at
        # launch, so the ask arrives with context (see LiveProgressorClient). Says
        # "force gauge", not "Tindeq Progressor": multi-gauge made the branded string
        # under-describing, the same rule the photo string below already follows.
        NSBluetoothAlwaysUsageDescription: >-
          Get a Grip connects to your force gauge over Bluetooth to measure the
          force you pull during a training session.
        # "calendar" was true while the calendar card was the only thing the app exported;
        # a routine's QR code is the second, so the copy moved with the feature rather
        # than quietly under-describing it.
        NSPhotoLibraryAddUsageDescription: >-
          Get a Grip saves your shareable images to your photo library.
        NSCameraUsageDescription: >-
          Get a Grip uses your camera to scan shared routine QR codes.
        # Required of the COMPANION by the watch app's workout session — the phone
        # itself never reads or writes Health data, and the strings say so.
        NSHealthShareUsageDescription: >-
          Get a Grip does not read your health data.
        NSHealthUpdateUsageDescription: >-
          The Apple Watch app records each hangboard session as a workout so it
          counts toward your rings and keeps running while your wrist is down.
        # A routine shared as a QR code IS the routine — the whole plan rides in the
        # URL's fragment, so scanning one in the system Camera app opens Get a Grip with
        # everything it needs and no server anywhere. The scheme is the only half of
        # that which has to be declared; `RoutineShare` already decodes the https form
        # as well, so a universal link can be added later without touching this. The
        # URL *name* keeps the bundle-id prefix — it is an identifier, not copy.
        CFBundleURLTypes:
          - CFBundleURLName: run.nuri.doigt.share
            CFBundleURLSchemes:
              - getagrip
        # A session must SURVIVE being backgrounded now that it has a Live Activity —
        # swiping home to change the music used to pause the workout. `bluetooth-central`
        # keeps the app alive while the Progressor is connected and delivering
        # notifications, which is exactly the window a session needs and nothing wider.
        # `remote-notification` is for SwiftData's CloudKit mirroring change pushes.
        # CloudKit manages those subscriptions; the app has no push handling of its own.
        UIBackgroundModes:
          - remote-notification
          - bluetooth-central
        NSSupportsLiveActivities: true
        # iPhone stays PORTRAIT: the island hand's fixed rect and the one-page Today are
        # both portrait facts. iPad must support every orientation — multitasking has
        # required it since iOS 9 and iPadOS 26 is retiring the full-screen opt-out —
        # so the layouts that need a landscape form (the runner, History) switch on size
        # class and aspect, never on the idiom.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Sources/Doigt.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - "$(GETAGRIP_CLOUD_CONTAINER)"
        # Reserved now even though nothing reads it yet: App Group identity is as
        # painful to retrofit as the bundle id, and a workout widget is likely.
        com.apple.security.application-groups:
          - "$(GETAGRIP_APP_GROUP)"
        # The watch app's workout session needs HealthKit, and Apple requires the
        # capability on the companion as well. The phone never touches Health itself.
        com.apple.developer.healthkit: true
        # Xcode resolves the signed environment from the provisioning profile.
        # Check the final distribution export for production; see BUILDING.md.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.nuri.doigt
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (2026-09-19)
        # OFF until someone has run it on a Mac with a gauge: Apple offers every iPad
        # app on Apple silicon Macs by default, and CoreBluetooth there is untested by
        # this project. Flip it deliberately, then re-check the App Store Connect
        # availability box that mirrors it.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    dependencies:
      # Embedded, so the Live Activity ships inside the app.
      - target: DoigtWidget
        embed: true
      # Embedded under Watch/, so the watch app installs with the phone's.
      - target: DoigtWatch
        embed: true

  # The Live Activity renders in its own process, so it compiles `Shared/` verbatim —
  # which is exactly why `Shared/` has always been its own source root. Nothing here may
  # reach into `Sources/`: the extension cannot see the store, the gauge or the runner,
  # and every value it draws arrives through `SessionActivity.ContentState`.
  DoigtWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        GetAGripAppGroup: "$(GETAGRIP_APP_GROUP)"
        GetAGripCloudContainer: "$(GETAGRIP_CLOUD_CONTAINER)"
        CFBundleDisplayName: "Get a Grip"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DoigtWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(GETAGRIP_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.nuri.doigt.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # The watch app: a STANDALONE GAUGE HOST — see `Watch/DoigtWatchApp.swift`. It compiles
  # the engine, the models, the BLE clients and the runner session VERBATIM from the
  # same files as the phone; the platform seams are `#if os(watchOS)` blocks inside
  # them, so a rule fixed in one place is fixed on both. `TemplateStore` is deliberately
  # NOT here — it is the phone's derived world (reminders, undo, the consistency strip);
  # the watch writes through `SessionLedger` and reads with `@Query`.
  DoigtWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch
      - path: Shared
      - path: Sources/Model
      - path: Sources/BLE
      - path: Sources/Store
        includes:
          - "DayClock.swift"
          - "DebugSeeding.swift"
          - "DeviceStore.swift"
          - "DiagnosticBreadcrumbs.swift"
          - "PipelineDiagnostics.swift"
          - "SessionLedger.swift"
          - "StorageMode.swift"
      - path: Sources/Runner
        includes:
          - "IdleTimerLock.swift"
          - "RestFocusPresentation.swift"
          - "RunnerSession.swift"
          - "RunnerTrainingGuidance.swift"
          - "SessionActivityController.swift"
          - "TarePolicy.swift"
      - path: Sources/UI/Components/WeightUnits.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: "Get a Grip"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GetAGripCloudContainer: "$(GETAGRIP_CLOUD_CONTAINER)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(GETAGRIP_COMPANION_BUNDLE_ID)"
        # `workout-processing` is what keeps the app — and with it the Bluetooth stream
        # — alive with the wrist down; `bluetooth-central` lets the link deliver while it
        # does. Neither is a licence to scan in the background: the app connects only
        # when a session starts.
        WKBackgroundModes:
          - workout-processing
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: >-
          Get a Grip connects to your force gauge over Bluetooth to measure the
          force you pull during a training session.
        NSHealthShareUsageDescription: >-
          Get a Grip does not read your health data.
        NSHealthUpdateUsageDescription: >-
          Get a Grip records each hangboard session as a workout so it counts toward
          your rings and keeps running while your wrist is down.
    entitlements:
      path: Watch/DoigtWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - "$(GETAGRIP_CLOUD_CONTAINER)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GETAGRIP_COMPANION_BUNDLE_ID).watchkitapp"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        SKIP_INSTALL: YES
        # A Debug build's stub-executable-plus-debug-dylib layout is what Xcode wants
        # for previews, and it is what the phone's Watch app REFUSES to install
        # ("integrity could not be verified", Nuri's watch, 2026-09-19). Installing the
        # watch app through the phone is the only route that works when Xcode cannot
        # reach the watch, so the watch target is built as one plain executable always.
        ENABLE_DEBUG_DYLIB: NO

  DoigtTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      # Host application: `@testable import Doigt` + running @MainActor code needs
      # the app as the test host.
      - target: Doigt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: run.nuri.doigt.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Doigt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Doigt"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DoigtUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: Doigt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: run.nuri.doigt.uitests
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  DoigtWatch:
    build:
      targets:
        DoigtWatch: all
    run:
      config: Debug
  # Named for the TARGET it runs, not for the first suite that needed it: UITests/ has
  # covered appearance, weight units, margins and layout since the legal-entry checks
  # this scheme was created for. `./build.sh uitest` drives it.
  DoigtUITests:
    build:
      targets:
        Doigt: all
        DoigtUITests: [test]
    test:
      config: Debug
      targets:
        - DoigtUITests
  Doigt:
    build:
      targets:
        Doigt: all
        DoigtTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoigtTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
