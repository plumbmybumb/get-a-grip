# The single source of truth for versions. Pinned 2026-09-04 against the primary sources
# (Gradle compatibility matrix, Google's and Maven Central's maven-metadata): Gradle 9.7.1
# (runs on JDK 17–26), Kotlin 2.4.10, AGP 9.4.0 (needs Gradle ≥ 9.6, JDK ≥ 17), Compose BOM
# 2026.08.00 (material3 1.4.0, ui 1.12.0).
[versions]
kotlin = "2.4.10"
agp = "9.4.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
compose-bom = "2026.08.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation-compose = "2.10.0"
# Not a dependency this app WANTS — see the constraint in app/build.gradle.kts.
fragment = "1.8.9"
core-ktx = "1.19.0"
core-splashscreen = "1.2.0"
room = "2.8.4"
# KSP's own numbering names the Kotlin release it was built against, and 2.3.11
# (2026-08-03) is the newest published — there is no 2.4.x line yet. It is KSP2, which
# runs on the Kotlin Analysis API rather than as a compiler plugin, so it tolerates a
# newer Kotlin than its own name; see the note in app/build.gradle.kts.
ksp = "2.3.11"
datastore = "1.2.1"
nordic-ble = "2.11.0"
zxing = "3.5.4"
zxing-embedded = "4.3.0"
junit-jupiter = "5.13.4"
robolectric = "4.16.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# `:app` needs the JUnit 5 flavour BY NAME: AGP's built-in Kotlin does not do the
# variant-aware framework selection the `kotlin.jvm` plugin gives `:engine`, so a plain
# `kotlin-test` there resolves without the `kotlin.test.Test` typealias.
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Robolectric's runner IS a JUnit 4 runner and has no JUnit 5 equivalent, so the store
# tests run on the Vintage engine inside the same JUnit Platform the rest of the suite
# uses. One `./android/build.sh test` still runs everything, JUnit 4 and 5 together.
junit4 = { module = "junit:junit", version = "4.13.2" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-jupiter" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# The PROCESS's own lifecycle, which is what the 45 s background grace hangs off: an
# Activity pausing is not the app leaving the foreground, and a rotation would otherwise
# schedule a disconnect for a gauge nobody put down.
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
nordic-ble-ktx = { module = "no.nordicsemi.android:ble-ktx", version.ref = "nordic-ble" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
