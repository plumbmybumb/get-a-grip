// Compose infers stability from the module that DECLARES a type, and `:engine` has no
// Compose on its classpath — so every engine value arrives in `:app` inferred UNSTABLE, is
// compared by identity, and a builder row recomposes whenever any copy of the plan is made.
//
// Every type listed here is a genuinely immutable VALUE: every property a `val`, every list
// replaced rather than mutated, and equality written over the fields a screen reads. Listing
// one states a fact; it must never be used to paper over a type that CAN change in place.
// `MaxTable` is deliberately absent — `record(...)` mutates it — and so is anything holding
// one.
run.nuri.getagrip.engine.SetPlan
run.nuri.getagrip.engine.SessionPlan
run.nuri.getagrip.engine.RoutineDraft
run.nuri.getagrip.engine.GripSpec
run.nuri.getagrip.engine.FingerSet
run.nuri.getagrip.engine.GripPosition
run.nuri.getagrip.engine.ReminderTime
run.nuri.getagrip.engine.RoutineSummary
run.nuri.getagrip.engine.LadderRung
