name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./android/build.sh :engine:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: ./build.sh test
      - run: ./Fixtures/tools/oracle/build.sh && ./Fixtures/tools/oracle/build/oracle runner verify Fixtures
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-log
          path: build/last-test.log
