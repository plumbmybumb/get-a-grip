name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token every job gets. Read-only, and nothing below asks for more: these jobs build
# and test, they never write to the repository, a release or a package.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in flight.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a COMMIT, with the release it was read from beside it. A tag
# is a name its owner can move; a commit is not. Dependabot (.github/dependabot.yml)
# proposes the bumps, so pinning costs a review rather than staleness.
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job never pushes, so the token is not left behind in .git/config for a
          # later step to read.
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      # Also validates the checked-in Gradle wrapper jar against Gradle's published hashes.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./android/build.sh :engine:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: ./build.sh test
      - run: ./Fixtures/tools/oracle/build.sh && ./Fixtures/tools/oracle/build/oracle runner verify Fixtures && ./Fixtures/tools/oracle/build/oracle agent verify Fixtures && ./Fixtures/tools/oracle/build/oracle share verify Fixtures && ./Fixtures/tools/oracle/build/oracle export verify Fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ios-test-log
          path: build/last-test.log
