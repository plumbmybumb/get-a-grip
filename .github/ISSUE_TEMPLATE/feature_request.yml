name: Feature request
description: Something the app should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The app is a daily ritual, not a library. Proposals that add a layer to
        assemble before you can pull — a grip library above all — are declined by
        design; see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where the app gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: One change, described from the training it serves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, or how another app handles it.
    validations:
      required: false
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - iPhone
        - iPad
        - Apple Watch
        - Android
    validations:
      required: true
